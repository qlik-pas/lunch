<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBFAF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14140F" media="(prefers-color-scheme: dark)">
<title>Dagens lunch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..48,500;12..48,600;12..48,700;12..48,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF6; --surface:#FFFFFF; --surface-2:#F5F3EC;
    --ink:#1A1913; --muted:#6B6A5E; --faint:#97968B;
    --accent:#B76C12; --accent-soft:#F4E4CD; --on-accent:#FFFFFF;
    --veg:#4C7A3F; --veg-soft:#E5EEDE;
    --hair:#E8E5DB;
    --shadow-sm:0 1px 2px rgba(26,22,10,.05);
    --shadow-md:0 1px 2px rgba(26,22,10,.04), 0 10px 30px -8px rgba(26,22,10,.10);
    --shadow-lg:0 1px 2px rgba(26,22,10,.05), 0 22px 46px -14px rgba(26,22,10,.17);
    --radius:16px; --radius-sm:11px;
    --display:"Bricolage Grotesque", system-ui, sans-serif;
    --body:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14140F; --surface:#1E1E18; --surface-2:#26251E;
      --ink:#F0EEE4; --muted:#A3A195; --faint:#74736A;
      --accent:#E9A94F; --accent-soft:#3A2E1B; --on-accent:#1A1913;
      --veg:#9BC489; --veg-soft:#2A3423;
      --hair:#33322B;
      --shadow-sm:0 1px 2px rgba(0,0,0,.35);
      --shadow-md:0 2px 6px rgba(0,0,0,.35), 0 14px 34px -10px rgba(0,0,0,.5);
      --shadow-lg:0 2px 6px rgba(0,0,0,.4), 0 26px 52px -14px rgba(0,0,0,.6);
    }
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--body); line-height:1.5; -webkit-font-smoothing:antialiased;
    max-width:600px; margin-inline:auto;
    padding:22px 18px calc(46px + env(safe-area-inset-bottom));
  }
  a{color:inherit}

  /* ---- eyebrow ---------------------------------------------------------- */
  .eyebrow{
    display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap;
    font-family:var(--display); font-weight:700; font-size:12.5px;
    letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  }
  .eyebrow .status{
    margin-left:auto; display:inline-flex; align-items:center; gap:6px;
    font-weight:600; letter-spacing:.04em;
  }
  .status .dot{width:7px; height:7px; border-radius:50%; background:var(--faint); flex:none}
  .status.live{color:var(--veg)}     .status.live .dot{background:var(--veg); box-shadow:0 0 0 3px color-mix(in srgb,var(--veg) 22%,transparent)}
  .status.stale{color:var(--accent)} .status.stale .dot{background:var(--accent)}

  /* ---- day rail (sticky) ---------------------------------------------------- */
  .railwrap{
    position:sticky; top:0; z-index:5;
    margin:16px -18px 2px; padding:10px 18px 8px;
    background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .rail{
    display:grid; grid-template-columns:repeat(5,1fr); gap:4px;
    background:var(--surface-2); border:1px solid var(--hair);
    border-radius:14px; padding:4px;
  }
  .day{
    appearance:none; border:0; background:transparent; cursor:pointer;
    border-radius:10px; padding:8px 2px 7px; color:var(--muted);
    font-family:var(--display); display:flex; flex-direction:column; align-items:center; gap:3px;
    transition:background .15s ease, color .15s ease, transform .15s ease;
  }
  .day .dow{font-weight:700; font-size:14px; letter-spacing:.01em}
  .day .dnum{font-size:11px; font-weight:600; color:var(--faint); min-height:1em}
  .day:hover{color:var(--ink); background:color-mix(in srgb,var(--accent) 9%,transparent)}
  .day[aria-selected="true"]{background:var(--accent); color:var(--on-accent); box-shadow:var(--shadow-sm)}
  .day[aria-selected="true"] .dnum{color:color-mix(in srgb,var(--on-accent) 78%,transparent)}
  .day[aria-selected="true"]:hover{color:var(--on-accent)}
  .day .today-dot{width:4px; height:4px; border-radius:50%; background:currentColor; opacity:0; transition:opacity .15s}
  .day.is-today .today-dot{opacity:.55}
  .day.is-today[aria-selected="true"] .today-dot{opacity:.9}
  .day:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* ---- day heading ---------------------------------------------------------- */
  .heading{
    font-family:var(--display); font-weight:800; letter-spacing:-.015em;
    font-size:clamp(1.7rem, 3vw + 1.1rem, 2.15rem);
    margin:13px 0 3px; text-transform:capitalize;
  }
  .subnote{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; margin:0 0 18px}
  .subnote .pill{
    font-family:var(--display); font-weight:700; font-size:11px; letter-spacing:.05em; text-transform:uppercase;
    padding:3px 8px; border-radius:7px; background:var(--accent-soft); color:var(--accent);
  }
  .subnote.today .pill{background:color-mix(in srgb,var(--veg) 20%,transparent); color:var(--veg)}

  /* ---- cards -------------------------------------------------------------- */
  .cards{display:flex; flex-direction:column; gap:12px}
  .card{
    background:var(--surface); border:1px solid var(--hair); border-radius:var(--radius);
    box-shadow:var(--shadow-md); padding:15px 16px 16px;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  @media (hover:hover){
    .card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:color-mix(in srgb,var(--accent) 35%,var(--hair))}
  }
  .card-head{display:flex; align-items:center; gap:10px; margin-bottom:11px}
  .badge{
    flex:none; width:30px; height:30px; border-radius:9px;
    display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:14px;
    background:hsl(var(--hue) 42% 92%); color:hsl(var(--hue) 45% 32%);
    border:1px solid hsl(var(--hue) 38% 82%);
  }
  @media (prefers-color-scheme: dark){
    .badge{background:hsl(var(--hue) 26% 22%); color:hsl(var(--hue) 55% 76%); border-color:hsl(var(--hue) 24% 32%)}
  }
  .card-head h2{font-family:var(--display); font-weight:700; font-size:17px; margin:0; line-height:1.2}
  .card-head h2 a{text-decoration:none; display:inline-flex; align-items:center; gap:5px}
  .card-head h2 a::after{content:"↗"; font-size:12px; color:var(--faint); transition:color .15s}
  .card-head h2 a:hover, .card-head h2 a:hover::after{color:var(--accent)}

  .dishes{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px}
  .dishes li{position:relative; padding-left:17px; font-size:14.5px; color:var(--ink)}
  .dishes li::before{
    content:""; position:absolute; left:2px; top:8px; width:6px; height:6px;
    border-radius:2px; background:color-mix(in srgb,var(--accent) 55%,var(--hair)); rotate:45deg;
  }
  .dishes li.veg{color:var(--ink)}
  .dishes li.veg::before{background:var(--veg); border-radius:50%; rotate:none}
  .veg-chip{
    display:inline-block; margin-right:6px; padding:1px 6px; border-radius:6px;
    font-family:var(--display); font-weight:700; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
    background:var(--veg-soft); color:var(--veg); vertical-align:1px;
  }
  .empty-today{color:var(--muted); font-size:13.5px; font-style:italic; margin:0}

  /* ---- others ------------------------------------------------------------ */
  .others{margin-top:24px}
  .others summary{
    cursor:pointer; list-style:none; display:flex; align-items:center; gap:9px;
    font-family:var(--display); font-weight:700; font-size:12px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--muted);
  }
  .others summary::-webkit-details-marker{display:none}
  .others summary::before{content:"›"; font-size:15px; transition:transform .16s; color:var(--faint)}
  .others[open] summary::before{transform:rotate(90deg)}
  .others summary .rule{flex:1; height:1px; background:var(--hair)}
  .others ul{list-style:none; margin:13px 0 0; padding:0; display:flex; flex-direction:column; gap:10px}
  .others li{display:flex; gap:9px; align-items:baseline; font-size:13.5px}
  .others .rname{font-weight:600}
  .others .rname a{text-decoration:none}
  .others .rname a:hover{color:var(--accent)}
  .others .static-text{color:var(--muted); font-size:12.5px; margin-left:auto; text-align:right; max-width:56%}
  .tag{
    font-size:10px; font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    padding:2px 7px; border-radius:6px; border:1px solid var(--hair); color:var(--faint); white-space:nowrap;
  }

  /* ---- footer ----------------------------------------------------------- */
  footer{
    margin-top:32px; padding-top:16px; border-top:1px solid var(--hair);
    color:var(--faint); font-size:12px; text-align:center;
    display:flex; flex-direction:column; gap:5px;
  }
  footer a{color:var(--muted); text-decoration:none; border-bottom:1px solid var(--hair)}
  footer a:hover{color:var(--accent)}

  @media (prefers-reduced-motion: no-preference){
    .card{animation:rise .26s cubic-bezier(.2,.7,.3,1) both}
    .card:nth-child(2){animation-delay:.04s}
    .card:nth-child(3){animation-delay:.08s}
    .card:nth-child(4){animation-delay:.12s}
    .card:nth-child(5){animation-delay:.16s}
    @keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  }
</style>
</head>
<body>
  <header class="eyebrow">
    <span id="weeklabel">Dagens lunch</span>
    <span class="status stale" id="status"><span class="dot"></span><span id="statusText">Laddar…</span></span>
  </header>

  <div class="railwrap">
    <div class="rail" id="rail" role="tablist" aria-label="Välj dag"></div>
  </div>

  <h1 class="heading" id="dayHeading">—</h1>
  <p class="subnote" id="daySub"></p>

  <div class="cards" id="cards"></div>

  <details class="others" id="others" hidden>
    <summary><span id="othersLabel">Övriga ställen</span><span class="rule"></span></summary>
    <ul id="othersList"></ul>
  </details>

  <footer>
    <span id="genLine"></span>
    <span>Skrapas varje vardagsmorgon · <a href="https://github.com/qlik-pas/lunch" target="_blank" rel="noopener">källkod</a></span>
  </footer>

<script>
/* ===========================================================================
   Today-first lunch board for five Lund places.

   Data: ./lt.json, written every weekday morning by scraper.py (GitHub Action).
   Shape: { week, range, dates[5], generated, restaurants:[{name,url,menus:{Day:[dish]}}] }
   If the fetch fails, the page renders the embedded snapshot below so it never
   shows blank.
   =========================================================================== */

const DAYS  = ["Måndag","Tisdag","Onsdag","Torsdag","Fredag"];
const SHORT = ["Mån","Tis","Ons","Tor","Fre"];

/* per-restaurant badge hue (falls back to a hash for unknown names) */
const HUES = {
  "Restaurang Edison": 28, "Bricks Eatery": 8, "Smaka på Kina": 352,
  "Kantin": 150, "Eatery": 205,
};
const hueFor = name => HUES[name] ??
  ([...name].reduce((h,c)=>(h*31 + c.charCodeAt(0))>>>0, 7) % 360);

/* ---- Embedded snapshot (fallback only) --------------------------------- */
let WEEK = {
  "week": 35,
  "range": "24–28 aug",
  "dates": ["2026-08-24","2026-08-25","2026-08-26","2026-08-27","2026-08-28"],
  "restaurants": [
    {
      "name": "Restaurang Edison",
      "url": "https://restaurangedison.se/lunch/",
      "menus": {
        "Måndag": ["Pumpagryta med halloumi serveras med ris, äpple & spenat","Panerad torsk med remoulad, kokt potatis, fänkål & ärtor","Kabanoss med surkål, potatismos, bakat äpple & persilja"],
        "Tisdag": ["Veg pytt med senapscreme, persilja & ägg 64","Panerad schnitzel med kryddsmör, stekt potatis & rostad broccoli","Kalkonfärslimpa med bakad purjo, äpple, rostad potatis & cidersenapssky"],
        "Onsdag": ["Röda linsplättar med citronkeso, krassesallad & bränd kål","Stekt sill med potatispuré, lingon, dill, lök & smör","Pasta med \"salsiccia\", vitt vin, zucchini & friterad salvia"],
        "Torsdag": ["Ärtwallenbergare med citronsmör, potatispuré & bakad morot","Fläskestek med sockerstekt potatis, äpplekompott, rödkål & sky","Persisk kyckling med libabröd, saffran, tomatsallad & sesamyoghurt"],
        "Fredag": ["Tomatsoppa med risonisallad, bakad rödlök, basilikacreme & ostscones","Nattabakad oxe med dragonmajo, rostad potatis & tomatsallad","Thailändsk laab på fläsk med rostat ris, koriander, böngroddar & ingefärsmajo"]
      }
    },
    {
      "name": "Bricks Eatery",
      "url": "https://brickseatery.se/lunch",
      "menus": {
        "Måndag": ["Majs och halloumifritter med ris, chilimajonnäs, pickles och purjolök","Isterband med gräddstuvad potatis, rödbetor, picklade senapsfrön och persilja","Chilirostad kycklinglårfilé med ris, gurka, böngroddar och rostad sesammajonnäs"],
        "Tisdag": ["Spenat och ricotta tortellini med tomatsås, lagrad ost, aubergine och ruccola","Orange chicken - apelsinsås, ingefära, chili, ostronsås, böngroddar, vårlök och sesam","Mozzarella, creme- fraiche, kantarell, italiensk hårdost och gräslök"],
        "Onsdag": ["Bondomelett med krämig waldorfsallad, valnötter, romansallad, rädisa och gurka","Stekt sill med klassiska tillbehör","Bibimbap med blandat kött, ostronsås, pickles, kimchisallad, ris och stekt ägg","Mozzarella, creme- fraiche, kantarell, italiensk hårdost och gräslök"],
        "Torsdag": ["Grönsakswok med soja, chili, hoisinsås, böngroddar, ris och stekt ägg","Pannbiff med stekt lök, potatismos, lingon, timjansky, morot och persilja","Mozzarella, creme- fraiche, kantarell, italiensk hårdost och gräslök"],
        "Fredag": ["Ost och lökpaj med coleslaw, rostad blomkål, bladspenat och picklad rödlök","Schnitzel med kryddsmör, rostad potatis, ärtor, spetskål, citron och skysås","Oxbringa med gnocchi, citrongrädde, bakad purjolök, lagrad ost och ruccola"]
      }
    },
    {
      "name": "Smaka på Kina",
      "url": "https://www.smakapakina.se/meny",
      "menus": {
        "Måndag": ["Krispig saltade kyckling (盐酥鸡)","Fläsk med skogsvamp (木耳炒肉)","Torrstekta grönabönor (干煸豆角)"],
        "Tisdag": ["Sötsur fisk i tomatsås (茄汁鱼片)","Bondes stekt fläsk (农家小炒肉)","Snabbstekd spetskål med glasnudlar (粉丝包菜)"],
        "Onsdag": ["Dongpo sidfläsk (东坡肉)","Gongbao kyckling (宫保鸡丁)","Snabbstekt pak choi (清炒油菜)","Tofu med honungsås (蜜汁豆腐)"],
        "Torsdag": ["Gult  bräserad biff (黄焖牛肉)","Kamben med chili och spiskummin (香辣孜然排骨)","Snabbstekt broccoli  (蒜蓉西兰花)"],
        "Fredag": ["Chili kyckling (辣子鸡)","Fläsk med surkål och glasnudlar (猪肉酸菜炖粉条)","Jordens tre goda wok (地三鲜)"]
      }
    },
    {
      "name": "Kantin",
      "url": "https://www.kantinlund.se/",
      "menus": {
        "Måndag": ["Pluma – gochujang beurre blanć – broccoli – kimchipicklad gurka – ris – frön – koriander","Vegetariskt: Bakad sötpotatis – fetostkräm – syrad lök – broccoli – jalapeño – fröer – hjärtsallad"],
        "Tisdag": ["Kycklinglårfilé – grön curry – bönor – groddar – paprika – hjärtsallad – rökt mandel – ris","Vegetariskt: Bakad sötpotatis – fetostkräm – syrad lök – broccoli – jalapeño – fröer – hjärtsallad"],
        "Onsdag": ["Nattbakad karré – bbqsås – majskräm – rostad lök – pickles – rostad potatis","Vegetariskt: Bakad sötpotatis – fetostkräm – syrad lök – broccoli – jalapeño – fröer – hjärtsallad"],
        "Torsdag": ["Råbiffstorsdag – Oxtartar – srirachamayo – krispig potatis – syrad lök – gröna bönor – ört","Vegetariskt: Bakad sötpotatis – fetostkräm – syrad lök – broccoli – jalapeño – fröer – hjärtsallad"],
        "Fredag": ["Nattbakat högrev – n’dujasky – sötpotatisstomp – broccoli – jalapeño – frön – örter","Vegetariskt: Bakad sötpotatis – fetostkräm – syrad lök – broccoli – jalapeño – fröer – hjärtsallad"]
      }
    },
    {
      "name": "Eatery",
      "url": "https://www.eatery.se/lund/lunchmeny",
      "menus": {"Måndag":[],"Tisdag":[],"Onsdag":[],"Torsdag":[],"Fredag":[]}
    }
  ]
};

/* ---- classification: card vs demoted to "others" --------------------- */
const isBlank = v => !Array.isArray(v) || v.filter(x => String(x).trim()).length === 0;

function classify(r){
  const filled = DAYS.map(d => r.menus?.[d]).filter(v => !isBlank(v));
  if (filled.length === 0) return { cat:"other", why:"ingen meny" };
  const flat = filled.map(v => v.join(" | "));
  if (new Set(flat).size === 1 && filled.length >= 4)
    return { cat:"other", why:"samma varje dag", text: filled[0].join(" · ") };
  return { cat:"card" };
}

/* ---- render --------------------------------------------------------------- */
let selected = 0;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayIndex = () => { const g = new Date().getDay(); return (g >= 1 && g <= 5) ? g - 1 : null; };
const fmtDate = iso => { try { return new Date(iso + "T00:00:00").toLocaleDateString("sv-SE",{day:"numeric",month:"short"}); } catch { return ""; } };

function dishItem(raw){
  const s = String(raw).trim();
  const m = s.match(/^vegetarisk[t]?\s*:\s*(.+)/i);
  if (m) return `<li class="veg"><span class="veg-chip">Veg</span>${esc(m[1])}</li>`;
  return `<li>${esc(s)}</li>`;
}

function buildRail(){
  const rail = document.getElementById("rail");
  const ti = todayIndex();
  rail.innerHTML = "";
  DAYS.forEach((d,i) => {
    const b = document.createElement("button");
    b.className = "day" + (ti === i ? " is-today" : "");
    b.type = "button";
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", String(i === selected));
    b.setAttribute("aria-label", d + (WEEK.dates?.[i] ? " " + fmtDate(WEEK.dates[i]) : ""));
    b.innerHTML =
      `<span class="dow">${SHORT[i]}</span>` +
      `<span class="dnum">${WEEK.dates?.[i] ? fmtDate(WEEK.dates[i]) : ""}</span>` +
      `<span class="today-dot"></span>`;
    b.addEventListener("click", () => { selected = i; render(); });
    rail.appendChild(b);
  });
}

function render(){
  const day = DAYS[selected], ti = todayIndex();

  document.getElementById("weeklabel").textContent =
    WEEK.week ? `Vecka ${WEEK.week}${WEEK.range ? " · " + WEEK.range : ""}` : "Dagens lunch";
  document.querySelectorAll(".day").forEach((b,i) => b.setAttribute("aria-selected", String(i === selected)));

  document.getElementById("dayHeading").textContent = day;
  const sub = document.getElementById("daySub");
  if (ti === null && selected === 0){
    sub.className = "subnote"; sub.innerHTML = `<span class="pill">Helg</span> visar måndag`;
  } else if (ti === selected){
    sub.className = "subnote today"; sub.innerHTML = `<span class="pill">Idag</span> ${WEEK.dates?.[selected] ? fmtDate(WEEK.dates[selected]) : ""}`;
  } else {
    sub.className = "subnote"; sub.textContent = WEEK.dates?.[selected] ? fmtDate(WEEK.dates[selected]) : "";
  }

  const cards = document.getElementById("cards");
  const others = [];
  cards.innerHTML = "";

  WEEK.restaurants.forEach(r => {
    const info = classify(r);
    if (info.cat !== "card"){ others.push({ r, info }); return; }

    const dishes = Array.isArray(r.menus[day]) ? r.menus[day].filter(x => String(x).trim()) : [];
    const body = dishes.length
      ? `<ul class="dishes">${dishes.map(dishItem).join("")}</ul>`
      : `<p class="empty-today">Ingen dagsmeny idag</p>`;
    const initial = esc([...r.name][0] || "•");

    const card = document.createElement("article");
    card.className = "card";
    card.style.setProperty("--hue", hueFor(r.name));
    card.innerHTML =
      `<div class="card-head">` +
        `<span class="badge" aria-hidden="true">${initial}</span>` +
        `<h2><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a></h2>` +
      `</div>${body}`;
    cards.appendChild(card);
  });

  const list = document.getElementById("othersList");
  list.innerHTML = others.map(({r,info}) =>
    `<li><span class="rname"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a></span>` +
    `<span class="tag">${esc(info.why)}</span>` +
    (info.text ? `<span class="static-text">${esc(info.text)}</span>` : ``) + `</li>`
  ).join("");
  document.getElementById("others").hidden = others.length === 0;
  document.getElementById("othersLabel").textContent = `Övriga ställen (${others.length})`;
}

function setStatus(live, note){
  const s = document.getElementById("status");
  s.className = "status " + (live ? "live" : "stale");
  document.getElementById("statusText").textContent = note;
}

function setGenerated(iso){
  if (!iso) return;
  try {
    const t = new Date(iso).toLocaleString("sv-SE",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
    document.getElementById("genLine").textContent = `Uppdaterad ${t}`;
  } catch {}
}

/* ---- boot ----------------------------------------------------------------- */
async function boot(){
  const ti = todayIndex();
  selected = ti === null ? 0 : ti;
  buildRail(); render();

  try {
    const res = await fetch("lt.json", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (Array.isArray(data.restaurants) && data.restaurants.length){
      WEEK = data;
      buildRail(); render();
      setStatus(true, "Live");
      setGenerated(WEEK.generated);
      return;
    }
    throw new Error("tomt svar");
  } catch (e) {
    setStatus(false, "Sparad meny");
  }
}
boot();
</script>
