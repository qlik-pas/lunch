<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FCFBF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F11" media="(prefers-color-scheme: dark)">
<title>Dagens lunch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FCFBF9; --surface:#FFFFFF; --surface-2:#F4F2EC;
    --ink:#1C1B19; --ink-soft:#3B3A35; --muted:#6C6A63; --faint:#9A978D;
    --hair:#E9E6DF; --hair-strong:#DAD6CC;
    --veg:#3F7A4B; --veg-soft:#E7F0E7;
    --treat:#9A6A16; --treat-soft:#F3E7CF;
    --sel:#1C1B19; --on-sel:#FCFBF9;
    --radius:18px; --radius-sm:10px;
    --shadow-rail:0 1px 0 var(--hair), 0 8px 24px -16px rgba(28,27,25,.28);
    --serif:"Fraunces", Georgia, "Times New Roman", serif;
    --sans:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --step:clamp(20px, 4vw, 30px);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0F0F11; --surface:#171719; --surface-2:#1E1E21;
      --ink:#ECEBE7; --ink-soft:#CDCBC4; --muted:#9B9A93; --faint:#6E6D66;
      --hair:#2A2A2E; --hair-strong:#38383D;
      --veg:#8FBF97; --veg-soft:#1F2A20;
      --treat:#D8A24E; --treat-soft:#332819;
      --sel:#ECEBE7; --on-sel:#141416;
      --shadow-rail:0 1px 0 var(--hair), 0 10px 28px -18px rgba(0,0,0,.7);
    }
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--sans); line-height:1.55; -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    max-width:640px; margin-inline:auto;
    padding:26px 22px calc(60px + env(safe-area-inset-bottom));
  }
  a{color:inherit}

  /* ---- masthead -------------------------------------------------------- */
  .masthead{
    display:flex; align-items:baseline; gap:10px 16px; flex-wrap:wrap;
    padding-bottom:16px; border-bottom:1px solid var(--hair);
  }
  .masthead .wk{
    font-family:var(--serif); font-weight:500; font-size:15px;
    letter-spacing:.005em; color:var(--ink-soft);
  }
  .masthead .status{
    margin-left:auto; display:inline-flex; align-items:center; gap:7px;
    font-size:11.5px; font-weight:500; letter-spacing:.06em; text-transform:uppercase;
    color:var(--faint);
  }
  .status .dot{width:6px; height:6px; border-radius:50%; background:var(--faint); flex:none}
  .status.live{color:var(--veg)}
  .status.live .dot{background:var(--veg); box-shadow:0 0 0 3px color-mix(in srgb,var(--veg) 20%,transparent)}
  .status.stale .dot{background:var(--faint)}

  /* ---- day rail (sticky) --------------------------------------------------- */
  .railwrap{
    position:sticky; top:0; z-index:5;
    margin:14px -22px 0; padding:12px 22px 12px;
    background:color-mix(in srgb,var(--bg) 86%,transparent);
    backdrop-filter:blur(12px) saturate(1.4); -webkit-backdrop-filter:blur(12px) saturate(1.4);
  }
  .rail{
    display:grid; grid-template-columns:repeat(5,1fr); gap:2px;
    background:var(--surface-2); border:1px solid var(--hair);
    border-radius:13px; padding:3px;
  }
  .day{
    appearance:none; border:0; background:transparent; cursor:pointer;
    border-radius:10px; padding:9px 2px 8px; color:var(--muted);
    font-family:var(--sans);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    transition:background .18s ease, color .18s ease;
  }
  .day .dow{font-weight:600; font-size:13px; letter-spacing:.02em}
  .day .dnum{font-size:10.5px; font-weight:500; color:var(--faint); min-height:1em; font-variant-numeric:tabular-nums}
  .day:hover{color:var(--ink)}
  .day[aria-selected="true"]{background:var(--sel); color:var(--on-sel)}
  .day[aria-selected="true"] .dnum{color:color-mix(in srgb,var(--on-sel) 72%,transparent)}
  .day .today-dot{width:3px; height:3px; border-radius:50%; background:currentColor; opacity:0; transition:opacity .18s}
  .day.is-today .today-dot{opacity:.45}
  .day.is-today[aria-selected="true"] .today-dot{opacity:.9}
  .day:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

  /* ---- day heading ------------------------------------------------------- */
  .dayhead{margin:var(--step) 0 calc(var(--step) - 4px)}
  .heading{
    font-family:var(--serif); font-weight:400; letter-spacing:-.01em;
    font-size:clamp(2.1rem, 6vw + .6rem, 2.9rem); line-height:1.05;
    margin:0; text-transform:capitalize; color:var(--ink);
  }
  .subnote{
    display:flex; align-items:center; gap:9px; margin:11px 0 0;
    color:var(--muted); font-size:13px;
  }
  .subnote .tag{
    font-weight:600; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
    padding:3px 7px 2px; border-radius:5px;
    background:var(--surface-2); color:var(--muted); border:1px solid var(--hair);
  }
  .subnote.today .tag{
    background:color-mix(in srgb,var(--veg) 16%,transparent);
    color:var(--veg); border-color:color-mix(in srgb,var(--veg) 28%,transparent);
  }
  .subnote .date{font-variant-numeric:tabular-nums}

  /* ---- random pick ------------------------------------------------------ */
  .picker{margin-top:var(--step); border-top:1px solid var(--hair); padding-top:20px}
  .picker-intro{
    margin:0; display:flex; align-items:center; flex-wrap:wrap; gap:12px 14px;
  }
  .picker-intro em{
    font-family:var(--serif); font-style:italic; font-weight:400;
    font-size:15px; color:var(--muted);
  }
  .picker-btn{
    appearance:none; cursor:pointer; border:1px solid var(--hair-strong);
    background:var(--surface); color:var(--ink); font-family:var(--sans);
    font-size:13.5px; font-weight:600; padding:9px 16px 9px 14px;
    border-radius:999px; display:inline-flex; align-items:center; gap:7px;
    transition:border-color .15s ease, transform .15s ease;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  .picker-btn:hover{border-color:var(--ink-soft)}
  .picker-btn:active{transform:scale(.96)}
  .picker-btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  .picker-btn .spin-ico{font-size:15px; line-height:1; display:inline-block}
  .picker-btn.spinning .spin-ico{animation:spin .5s linear infinite}

  .picker-result[hidden]{display:none}
  .picker-result{
    margin-top:12px; display:flex; align-items:stretch;
    border:1px solid var(--hair); border-radius:var(--radius-sm);
    background:var(--surface-2); overflow:hidden;
    transition:background-color .35s ease;
  }
  .picker-result.landed{
    background:color-mix(in srgb, hsl(var(--hue) 58% 46%) 16%, var(--surface-2));
  }
  @media (prefers-color-scheme: dark){
    .picker-result.landed{
      background:color-mix(in srgb, hsl(var(--hue) 55% 55%) 18%, var(--surface-2));
    }
  }
  .reel-mask{flex:1; min-width:0; overflow:hidden}
  .reel{display:flex; flex-direction:column; will-change:transform}
  .reel-item{
    flex:none; display:flex; align-items:center; gap:11px; padding:12px 14px;
  }
  .reel-item .shield{flex:none}
  .reel-item .ptext{flex:1; min-width:0}
  .reel-item .pname{
    font-family:var(--serif); font-weight:500; font-size:14px; color:var(--ink);
    display:block;
  }
  .reel-item .pdish{
    font-size:13.5px; line-height:1.45; color:var(--ink-soft); margin-top:2px;
    display:flex; align-items:center;
    min-height:calc(1.45em * 2);   /* room for 2 lines so every row is the same height */
  }
  .reel-item .pdish-text{
    /* Every row's height feeds the reel's scroll math — a dish long enough to
       wrap to 3 lines would grow just that row and break the alignment of
       every row after it. Clamp to 2 lines with an ellipsis so it can't. */
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .picker-again{
    flex:none; align-self:stretch; display:flex; align-items:center;
    appearance:none; border:0; border-left:1px solid var(--hair); background:none;
    color:var(--faint); font-size:17px; line-height:1; padding:0 14px; cursor:pointer;
    transition:color .15s ease;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  .picker-again:hover{color:var(--ink)}
  .picker-again:focus-visible{outline:2px solid var(--ink); outline-offset:-2px}
  .picker-again.spinning{animation:spin .5s linear infinite}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes reel-loop{to{transform:translateY(var(--loop-dist))}}
  @media (prefers-reduced-motion: reduce){
    .picker-btn.spinning .spin-ico{animation:none}
    .picker-again.spinning{animation:none}
  }

  /* ---- places --------------------------------------------------------- */
  .places{display:flex; flex-direction:column}
  .place{
    --tint:color-mix(in srgb, hsl(var(--hue) 62% 45%) 100%, transparent);
    padding:var(--step) 0;
    border-top:1px solid var(--hair);
    animation:rise .3s cubic-bezier(.2,.7,.3,1) both;
  }
  .place:first-child{border-top:0; padding-top:6px}
  .place:nth-child(2){animation-delay:.05s}
  .place:nth-child(3){animation-delay:.10s}
  .place:nth-child(4){animation-delay:.15s}
  .place:nth-child(5){animation-delay:.20s}

  .place-head{display:flex; align-items:center; gap:11px; margin-bottom:14px}
  .shield{
    flex:none; width:30px; height:30px; border-radius:9px;
    display:grid; place-items:center;
    font-family:var(--serif); font-weight:500; font-size:15px; line-height:1;
    background:color-mix(in srgb, hsl(var(--hue) 58% 46%) 15%, var(--surface));
    color:hsl(var(--hue) 55% 34%);
    box-shadow:inset 0 0 0 1px color-mix(in srgb, hsl(var(--hue) 55% 45%) 30%, transparent);
  }
  @media (prefers-color-scheme: dark){
    .shield{
      background:color-mix(in srgb, hsl(var(--hue) 55% 55%) 16%, var(--surface));
      color:hsl(var(--hue) 60% 72%);
      box-shadow:inset 0 0 0 1px color-mix(in srgb, hsl(var(--hue) 55% 60%) 26%, transparent);
    }
  }
  .place-head h2{
    font-family:var(--serif); font-weight:500; font-size:1.28rem; letter-spacing:-.005em;
    margin:0; line-height:1.15; flex:1; min-width:0;
  }
  .place-head h2 a{
    text-decoration:none; display:inline; background-image:linear-gradient(var(--hair-strong),var(--hair-strong));
    background-size:100% 1px; background-repeat:no-repeat; background-position:0 100%;
    transition:background-size .2s ease;
  }
  .place-head h2 a:hover{
    background-image:linear-gradient(hsl(var(--hue) 55% 45%),hsl(var(--hue) 55% 45%));
  }
  .place-head .go{flex:none; color:var(--faint); font-size:13px; transition:color .15s}
  .place:hover .place-head .go{color:hsl(var(--hue) 55% 45%)}

  .dishes{margin:0; padding:0; list-style:none; display:flex; flex-direction:column}
  .dishes li{
    padding:9px 0 9px 20px; position:relative;
    font-size:15.5px; line-height:1.5; color:var(--ink-soft);
    border-top:1px solid color-mix(in srgb,var(--hair) 60%,transparent);
  }
  .dishes li:first-child{border-top:0}
  .dishes li::before{
    content:""; position:absolute; left:3px; top:16px; width:5px; height:5px;
    border-radius:50%; background:hsl(var(--hue) 45% 55%);
  }
  .dishes li.veg{color:var(--ink)}
  .dishes li.veg::before{background:var(--veg)}
  .dishes li.treat{color:var(--ink)}
  .dishes li.treat::before{background:var(--treat); rotate:45deg; border-radius:1px}
  .veg-chip, .treat-chip{
    display:inline-block; margin-right:7px; padding:1px 6px 0; border-radius:5px;
    font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    vertical-align:2px;
  }
  .veg-chip{background:var(--veg-soft); color:var(--veg)}
  .treat-chip{background:var(--treat-soft); color:var(--treat)}
  .empty-today{
    margin:2px 0 0; color:var(--faint); font-size:14px; font-style:italic;
    font-family:var(--serif);
  }

  /* ---- also open (demoted) ------------------------------------------------ */
  .others{margin-top:var(--step); border-top:1px solid var(--hair); padding-top:20px}
  .others summary{
    cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px;
    font-size:11.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    color:var(--faint);
  }
  .others summary::-webkit-details-marker{display:none}
  .others summary::after{content:"+"; margin-left:auto; font-size:14px; transition:transform .18s}
  .others[open] summary::after{transform:rotate(45deg)}
  .others ul{list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; gap:12px}
  .others li{font-size:13.5px; line-height:1.5}
  .others .rname{font-family:var(--serif); font-weight:500; font-size:15px}
  .others .rname a{text-decoration:none}
  .others .note{color:var(--faint); margin-left:8px}
  .others .static-text{display:block; color:var(--muted); margin-top:3px}

  /* ---- footer --------------------------------------------------------- */
  footer{
    margin-top:calc(var(--step) + 8px); padding-top:18px; border-top:1px solid var(--hair);
    color:var(--faint); font-size:11.5px; text-align:center;
    display:flex; flex-direction:column; gap:5px;
  }
  footer a{color:var(--muted); text-decoration:none; border-bottom:1px solid var(--hair)}
  footer a:hover{color:var(--ink)}

  @keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){
    .place{animation:none}
    *{transition-duration:.01ms !important}
  }
</style>
</head>
<body>
  <header class="masthead">
    <span class="wk" id="weeklabel">Dagens lunch</span>
    <span class="status stale" id="status"><span class="dot"></span><span id="statusText">Laddar…</span></span>
  </header>

  <div class="railwrap">
    <div class="rail" id="rail" role="tablist" aria-label="Välj dag"></div>
  </div>

  <div class="dayhead">
    <h1 class="heading" id="dayHeading">—</h1>
    <p class="subnote" id="daySub"></p>
  </div>

  <div class="places" id="places"></div>

  <div class="picker">
    <p class="picker-intro">
      <em>Svårt att bestämma sig?</em>
      <button class="picker-btn" id="pickBtn" type="button" aria-expanded="false" aria-controls="pickResult">
        <span class="spin-ico" aria-hidden="true">↻</span> Vad blir det?
      </button>
    </p>
    <div class="picker-result" id="pickResult" hidden>
      <div class="reel-mask" id="reelMask"><div class="reel" id="reel"></div></div>
      <button class="picker-again" id="pickAgain" type="button" aria-label="Slumpa igen">↺</button>
    </div>
  </div>

  <details class="others" id="others" hidden>
    <summary><span id="othersLabel">Även öppet</span></summary>
    <ul id="othersList"></ul>
  </details>

  <footer>
    <span id="genLine"></span>
    <span>Skrapas varje vardagsmorgon · <a href="https://github.com/qlik-pas/lunch" target="_blank" rel="noopener">källkod</a></span>
  </footer>

<script>
/* ===========================================================================
   Today-first lunch board for five Lund places.

   Data: ./lt.json, written every weekday morning by scraper.py (GitHub Action).
   Shape: { week, range, dates[5], generated, restaurants:[{name,url,menus:{Day:[dish]}}] }
   If the fetch fails, the page renders the embedded snapshot below so it never
   shows blank.
   =========================================================================== */

const DAYS  = ["Måndag","Tisdag","Onsdag","Torsdag","Fredag"];
const SHORT = ["Mån","Tis","Ons","Tor","Fre"];

/* per-restaurant accent hue (falls back to a hash for unknown names) */
const HUES = {
  "Restaurang Edison": 32, "Bricks Eatery": 350, "Smaka på Kina": 292,
  "Kantin": 155, "Eatery": 210,
};
const hueFor = name => HUES[name] ??
  ([...name].reduce((h,c)=>(h*31 + c.charCodeAt(0))>>>0, 7) % 360);

/* ---- Embedded snapshot (fallback only) --------------------------------- */
let WEEK = {
  "week": 39,
  "range": "21–25 sep",
  "dates": ["2026-09-21", "2026-09-22", "2026-09-23", "2026-09-24", "2026-09-25"],
  "restaurants": [
    {
      "name": "Bricks Eatery",
      "url": "https://brickseatery.se/lunch",
      "menus": {
        "Måndag": ["Potatis och purjolökssoppa med vitlöksbröd, färskostkräm, bakat ägg, potatischips och kruspersilja","Rödbetsrisotto med kyckling, rostade rödbetor, dragonolja, ruccola och picklad rödlök","Färsbiff med teriyakisås, ris, brynt kål, champinjoner och jordnötter"],
        "Tisdag": ["Fylld pasta med tryffelgrädde, purjolök, brynt svamp, lagrad ost och bladspenat","Kyckling i vin med potatismos, syltlök, bacon, morot, champinjoner och kruspersilja","Mozzarella, tomatsås, Nduja ( krämig stark salami), basilika och kronärtskocka"],
        "Onsdag": ["“Tofu med bambu”, soja, chili, ris, koriander och böngroddar","Stekt Multe med bön cassoulet, tomater, oliver och italiensk hårdost","Wokat fläsk i gojujangchili, ris, grönsaker, böngroddar och koriander","Mozzarella, tomatsås, Nduja ( krämig stark salami), basilika och kronärtskocka"],
        "Torsdag": ["Okonomiyaki- japansk kålpannkaka med chilicoleslaw, sojabönor och BBQ-sås","Indisk “biff vindaloo” på högrev med ris, naanbröd, gurkraita, paprika och lök","Mozzarella, tomatsås, Nduja ( krämig stark salami), basilika och kronärtskocka","Bonus: äppelpaj med grädde"],
        "Fredag": ["Falafelburgare med med rostad potatis, rökt chilimajonnäs, pickles och isbergssallad","Kroppkakor med lingon, kål, brynt smör, mandel och persilja","Friterad kycklingburgare (KFC- style) med rostad potatis, rökt chilimajonnäs, pickles och isbergssallad"]
      }
    },
    {
      "name": "Eatery",
      "url": "https://www.eatery.se/lund/lunchmeny",
      "menus": {
        "Måndag": ["Sticky koreansk kyckling med gochujang och soja, gurksallad, sesamris och salladslök","Färskostbakad hokifilé med betor, spenat, hasselnötter och brynt smör, dillkräm och koktpotatis","Indisk kokos och linsgryta med bakad pumpa, picklade rotfrukter, mynta yoghurt och basmatiris med nejlika och stjärnanis"],
        "Tisdag": ["BBQ marinerad pluma med majskräm, tomatsallad och klyftpotatis, chilibéarnaise","Sesamstekt kungsfisk med sesammarinerad morot, krämig vittvinsås med miso och ingefära, potatismos med brynt smör","Dan dan nudlar med spicy vegfärs, jordnötter, salladslök och sesam","Bonus: något sött till kaffet"],
        "Onsdag": ["Färsbiffar med krämig svampsås, rostad potatis, grönabönor med bakad lök och bacon","Vin och tomatbakad kummel med basilikapesto, marinerad paprika och zucchini, bakad potatis med gremolata","Majs och yoghurtplättar med pico de gallo, rostad sötpotatissallad och rökt paprikakräm"],
        "Torsdag": ["Kyckling thai curry med kokos, röd curry, lime och ingefära, rostad broccoli och jasminris","Kungsfisk bakad i skaldjursfond med saffransås, dill picklad kålrot, potatis med gräslök, purjolök och smör","Krispig halloumiburgare med grön aioli, picklad gurka, sallad och klyftpotatis","Bonus: pannkakor, lättvispad grädde och hemmagjord sylt"],
        "Fredag": ["Dansk fläskstekburgare med rödkål, örtmajo, äpple och rostad klyftpotatis","Panerad tilapia med remoulad, kokt potatis och picklade rotfrukter","Gnocchi med tomatsås sallad på oliver, kronärtskocka och spenat, ruccola och lagrad ost"]
      }
    },
    {
      "name": "Smaka på Kina",
      "url": "https://www.smakapakina.se/meny",
      "menus": {
        "Måndag": ["General Tsos kyckling (左宗棠鸡)","Fläsk med grönabönor (四季豆炒肉)","Snabbstekt blomkål (干锅花菜)"],
        "Tisdag": ["Wokade kyckling med chili (双椒鸡丁)","Kamben med svartsojabönsås (豉汁排骨)","Snabbstekt spetskål (手撕包菜)"],
        "Onsdag": ["Rött bräserat sidfläsk (红烧肉)","Biff i chiligryta (水煮牛肉)","Potatis strimlor med paprika (彩椒土豆丝)","Mapo Tofu (麻婆豆腐)"],
        "Torsdag": ["Ångkokt fläsk med senapskål (梅菜扣肉)","Spicy pot mix (麻辣香锅)","Homestyle tofu (家常豆腐)"],
        "Fredag": ["Sötsur fläsk med anannas (菠萝古老肉)","Rött bräserat lammribs (红焖羊排)","Selleri med cashewnötter och liljalök (腰果百合西芹)"]
      }
    },
    {
      "name": "Restaurang Edison",

        "Tisdag": ["Pluma – basilika beurre blanć – gröna ärtor – stjälkselleri – smetana – polkabeta – grön chili – frön – potatis","Vegetariskt: Bakad portabello – gröna linser – rostad beta – pickles – citronsmetana – örter"],
        "Onsdag": ["Guajillo bakad kycklinglårfilé – hjärtsallad – sambal majo – tomat – pickles – friterad tortilla – potatis – koriander","Vegetariskt: Bakad portabello – gröna linser – rostad beta – pickles – citronsmetana – örter"],
        "Torsdag": ["Råbiffstorsdag – Oxtartar – mozzarellacremé – tomater – lök – bönor – olivkrisp – ruccola","Vegetariskt: Bakad portabello – gröna linser – rostad beta – pickles – citronsmetana – örter"],
        "Fredag": ["Skirtsteak – tryffelmajo – bakad tomat – bordelaisesås – örtrostad potatis","Vegetariskt: Bakad portabello – gröna linser – rostad beta – pickles – citronsmetana – örter"]

};

/* ---- classification: full block vs demoted to "also open" ------------- */
const isBlank = v => !Array.isArray(v) || v.filter(x => String(x).trim()).length === 0;

function classify(r){
  const filled = DAYS.map(d => r.menus?.[d]).filter(v => !isBlank(v));
  if (filled.length === 0) return { cat:"other", why:"ingen meny publicerad" };
  const flat = filled.map(v => v.join(" | "));
  if (new Set(flat).size === 1 && filled.length >= 4)
    return { cat:"other", why:"samma meny varje dag", text: filled[0].join(" · ") };
  return { cat:"place" };
}

/* ---- render --------------------------------------------------------------- */
let selected = 0;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayIndex = () => { const g = new Date().getDay(); return (g >= 1 && g <= 5) ? g - 1 : null; };
const fmtDate = iso => { try { return new Date(iso + "T00:00:00").toLocaleDateString("sv-SE",{day:"numeric",month:"short"}); } catch { return ""; } };

function dishItem(raw){
  const s = String(raw).trim().replace(/\s{2,}/g, " ");
  let m = s.match(/^vegetarisk[t]?\s*:\s*(.+)/i);
  if (m) return `<li class="veg"><span class="veg-chip">Grönt</span>${esc(m[1])}</li>`;
  m = s.match(/^bonus\s*:\s*(.+)/i);
  if (m) return `<li class="treat"><span class="treat-chip">Bonus</span>${esc(m[1])}</li>`;
  return `<li>${esc(s)}</li>`;
}

function buildRail(){
  const rail = document.getElementById("rail");
  const ti = todayIndex();
  rail.innerHTML = "";
  DAYS.forEach((d,i) => {
    const b = document.createElement("button");
    b.className = "day" + (ti === i ? " is-today" : "");
    b.type = "button";
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", String(i === selected));
    b.setAttribute("aria-label", d + (WEEK.dates?.[i] ? " " + fmtDate(WEEK.dates[i]) : ""));
    b.innerHTML =
      `<span class="dow">${SHORT[i]}</span>` +
      `<span class="dnum">${WEEK.dates?.[i] ? fmtDate(WEEK.dates[i]) : ""}</span>` +
      `<span class="today-dot"></span>`;
    b.addEventListener("click", () => { selected = i; render(); });
    rail.appendChild(b);
  });
}

function render(){
  const day = DAYS[selected], ti = todayIndex();

  document.getElementById("weeklabel").textContent =
    WEEK.week ? `Vecka ${WEEK.week}${WEEK.range ? " · " + WEEK.range : ""}` : "Dagens lunch";
  document.querySelectorAll(".day").forEach((b,i) => b.setAttribute("aria-selected", String(i === selected)));

  document.getElementById("dayHeading").textContent = day;
  document.getElementById("pickResult").hidden = true;
  document.getElementById("pickBtn").setAttribute("aria-expanded", "false");
  const sub = document.getElementById("daySub");
  const dateStr = WEEK.dates?.[selected] ? fmtDate(WEEK.dates[selected]) : "";
  if (ti === null && selected === 0){
    sub.className = "subnote"; sub.innerHTML = `<span class="tag">Helg</span><span class="date">visar måndag</span>`;
  } else if (ti === selected){
    sub.className = "subnote today"; sub.innerHTML = `<span class="tag">Idag</span><span class="date">${dateStr}</span>`;
  } else {
    sub.className = "subnote"; sub.innerHTML = `<span class="date">${dateStr}</span>`;
  }

  const wrap = document.getElementById("places");
  const others = [];
  wrap.innerHTML = "";

  WEEK.restaurants.forEach(r => {
    const info = classify(r);
    if (info.cat !== "place"){ others.push({ r, info }); return; }

    const dishes = Array.isArray(r.menus[day]) ? r.menus[day].filter(x => String(x).trim()) : [];
    const body = dishes.length
      ? `<ul class="dishes">${dishes.map(dishItem).join("")}</ul>`
      : `<p class="empty-today">Ingen dagsmeny idag</p>`;
    const initial = esc([...r.name][0] || "•");

    const el = document.createElement("article");
    el.className = "place";
    el.style.setProperty("--hue", hueFor(r.name));
    el.innerHTML =
      `<div class="place-head">` +
        `<span class="shield" aria-hidden="true">${initial}</span>` +
        `<h2><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a></h2>` +
        `<span class="go" aria-hidden="true">↗</span>` +
      `</div>${body}`;
    wrap.appendChild(el);
  });

  const list = document.getElementById("othersList");
  list.innerHTML = others.map(({r,info}) =>
    `<li><span class="rname"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a></span>` +
    `<span class="note">${esc(info.why)}</span>` +
    (info.text ? `<span class="static-text">${esc(info.text)}</span>` : ``) + `</li>`
  ).join("");
  document.getElementById("others").hidden = others.length === 0;
  document.getElementById("othersLabel").textContent = `Även öppet (${others.length})`;
}

function setStatus(live, note){
  const s = document.getElementById("status");
  s.className = "status " + (live ? "live" : "stale");
  document.getElementById("statusText").textContent = note;
}

function setChecked(menuIso){
  /* The live fetch just succeeded, so "now" is when the menu was last checked.
     `generated` is when the menu content last changed — usually Monday, and
     that's fine for a weekly menu, so only spell it out when it's not today. */
  const now = new Date();
  let line = `Kontrollerad kl ${now.toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"})}`;
  try {
    const menu = new Date(menuIso);
    if (!isNaN(menu) && menu.toDateString() !== now.toDateString())
      line += ` · menyn från ${menu.toLocaleDateString("sv-SE",{weekday:"short",day:"numeric",month:"short"})}`;
  } catch {}
  document.getElementById("genLine").textContent = line;
}

/* ---- random pick ------------------------------------------------------ */
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let cancelPendingLanding = null;   // guards against a stale landing from an interrupted spin

/* Waits for the reel's transform transition to finish, then runs `onDone`
   exactly once. A `transitionend` normally does it, but that event has
   turned out to occasionally not fire at all (observed in testing — the
   transform still reaches its target, the event just never arrives), which
   would otherwise leave the reel permanently stuck mid-scroll. A timeout
   slightly past the transition's own duration races it as a backstop. */
function raceLanding(reel, transitionMs, onDone){
  if (cancelPendingLanding) cancelPendingLanding();
  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    reel.removeEventListener("transitionend", onTransitionEnd);
    clearTimeout(timer);
    cancelPendingLanding = null;
    onDone();
  };
  const onTransitionEnd = (e) => { if (e.propertyName === "transform") finish(); };
  reel.addEventListener("transitionend", onTransitionEnd);
  const timer = setTimeout(finish, transitionMs + 200);
  cancelPendingLanding = () => {
    finished = true;
    reel.removeEventListener("transitionend", onTransitionEnd);
    clearTimeout(timer);
    cancelPendingLanding = null;
  };
}

function todaysPickPool(){
  const day = DAYS[selected], pool = [];
  WEEK.restaurants.forEach(r => {
    const dishes = Array.isArray(r.menus[day]) ? r.menus[day] : [];
    dishes.forEach(raw => {
      const s = String(raw).trim();
      if (!s || /^bonus\s*:/i.test(s)) return;              // not a lunch choice
      const veg = s.match(/^vegetarisk[t]?\s*:\s*(.+)/i);
      pool.push({ name: r.name, hue: hueFor(r.name), dish: veg ? veg[1] : s });
    });
  });
  return pool;
}

function reelRow(p){
  const pdish = s => `<span class="pdish"><span class="pdish-text">${esc(s)}</span></span>`;
  return p
    ? `<div class="reel-item">` +
        `<span class="shield" aria-hidden="true" style="--hue:${p.hue}">${esc([...p.name][0] || "•")}</span>` +
        `<span class="ptext"><span class="pname">${esc(p.name)}</span>${pdish(p.dish)}</span>` +
      `</div>`
    : `<div class="reel-item"><span class="ptext"><span class="pname">Inget att slumpa</span>` +
      `${pdish("Ingen dagsmeny hittades för den här dagen")}</span></div>`;
}

/* Lay the reel out flat (no transition) showing exactly one row, and report
   that row's real rendered height so the mask/scroll distance can match it
   exactly regardless of how long the dish text turns out to be. */
function layReelFlat(rows){
  const reel = document.getElementById("reel"), mask = document.getElementById("reelMask");
  reel.style.transition = "none";
  reel.style.transform = "translateY(0)";
  reel.innerHTML = rows.map(reelRow).join("");
  const rowH = reel.children[0].offsetHeight;
  mask.style.height = rowH + "px";
  return rowH;
}

function tintResult(hue){
  const result = document.getElementById("pickResult");
  result.style.setProperty("--hue", hue);
  result.classList.add("landed");
}

function spinPick(){
  const pool = todaysPickPool();
  const result = document.getElementById("pickResult");
  const btn = document.getElementById("pickBtn");
  btn.setAttribute("aria-expanded", "true");
  result.hidden = false;
  result.classList.remove("landed");                    // neutral again until it lands

  if (!pool.length){ layReelFlat([null]); return; }

  const final = pool[Math.floor(Math.random() * pool.length)];
  if (reduceMotion || pool.length === 1){ layReelFlat([final]); tintResult(final.hue); return; }

  const spins = 8;                                     // random rows before landing
  const rows = Array.from({length: spins}, () => pool[Math.floor(Math.random() * pool.length)]);
  rows.push(final);
  const rowH = layReelFlat(rows);
  const reel = document.getElementById("reel");

  btn.classList.add("spinning");
  void reel.offsetHeight;                               // commit the flat state first
  const spinMs = 1600;
  requestAnimationFrame(() => {
    // One continuous, eased scroll — smoother and easier to read than
    // swapping text every tick — decelerating into the landing, like a wheel
    // coasting to a stop. Was cubic-bezier(.11,.72,.13,1), which measured out
    // as reaching 100% of the distance by 40% of the duration and then
    // sitting dead still for the rest — by the time cleanup ran (icon
    // stopping, background tinting in, row-swap), the reel had looked
    // finished for the best part of a second, so cleanup read as a glitch
    // rather than a landing. This curve keeps easing visibly right up to
    // the end, so cleanup lands the instant it looks like it should.
    reel.style.transition = `transform ${spinMs}ms cubic-bezier(.22,1,.36,1)`;
    reel.style.transform = `translateY(${-spins * rowH}px)`;
  });
  raceLanding(reel, spinMs, () => {
    btn.classList.remove("spinning");
    tintResult(final.hue);
    // Only the landed row matters now — drop the 8 that scrolled past so
    // there's just one row in the DOM again (nothing for a screen reader or
    // anything else walking the page to trip over).
    reel.style.transition = "none";
    reel.style.transform = "translateY(0)";
    reel.innerHTML = reelRow(final);
  });
}

/* ---- press-and-hold spin ------------------------------------------------ */
// Holding the button spins for as long as you hold it (a seamless looping
// reel, so there's no fixed "how long is a spin" to wait out), and releasing
// commits: freeze exactly where it was, then a short decelerating roll onto
// a freshly chosen dish — the same landing feel as spinPick's fixed spin,
// just starting from wherever the hold let go instead of from a standing
// start. Keyboard activation (Enter/Space) can't "hold", so it still gets
// spinPick's complete fixed-duration spin via the click fallback below.
let holding = false;

function startSpin(btn){
  if (holding) return;
  const pool = todaysPickPool();
  const result = document.getElementById("pickResult");
  result.hidden = false;
  result.classList.remove("landed");
  btn.setAttribute("aria-expanded", "true");

  if (!pool.length){ layReelFlat([null]); return; }
  if (reduceMotion || pool.length === 1){
    const final = pool[Math.floor(Math.random() * pool.length)];
    layReelFlat([final]);
    tintResult(final.hue);
    return;
  }

  holding = true;
  btn.classList.add("spinning");

  const loopRows = 14;
  const rows = Array.from({length: loopRows}, () => pool[Math.floor(Math.random() * pool.length)]);
  const reel = document.getElementById("reel");
  const rowH = layReelFlat(rows.concat(rows));   // duplicated so the loop wraps seamlessly
  reel.style.setProperty("--loop-dist", `${-loopRows * rowH}px`);
  reel.style.animation = "reel-loop 2.2s linear infinite";
}

function stopSpin(btn){
  if (!holding) return;
  holding = false;
  btn.classList.remove("spinning");

  const pool = todaysPickPool();
  const reel = document.getElementById("reel");

  // Freeze the loop at its exact current position — no snapping, no jump —
  // so the landing roll continues the same motion instead of restarting it.
  const m = new DOMMatrix(getComputedStyle(reel).transform);
  reel.style.animation = "none";
  reel.style.transition = "none";
  reel.style.transform = `translateY(${m.m42}px)`;
  void reel.offsetHeight;

  if (!pool.length){ layReelFlat([null]); return; }
  const final = pool[Math.floor(Math.random() * pool.length)];

  const rowH = reel.children[0].offsetHeight;
  const extra = 4;                               // a few more decelerating rows, then land
  const extraRows = Array.from({length: extra}, () => pool[Math.floor(Math.random() * pool.length)]);
  extraRows.push(final);
  const oldLen = reel.children.length;
  reel.insertAdjacentHTML("beforeend", extraRows.map(reelRow).join(""));
  void reel.offsetHeight;   // commit the frozen position + new rows before animating away from it

  const landMs = 800;
  requestAnimationFrame(() => {
    reel.style.transition = `transform ${landMs}ms cubic-bezier(.22,1,.36,1)`;   // see spinPick's note on the curve
    reel.style.transform = `translateY(${-(oldLen + extra) * rowH}px)`;
  });
  raceLanding(reel, landMs, () => {
    tintResult(final.hue);
    reel.style.transition = "none";
    reel.style.transform = "translateY(0)";
    reel.innerHTML = reelRow(final);
  });
}

function wirePress(el){
  el.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;   // left button / touch / pen only
    startSpin(el);
  });
  el.addEventListener("pointerup", () => stopSpin(el));
  el.addEventListener("pointercancel", () => stopSpin(el));
  el.addEventListener("pointerleave", () => stopSpin(el));     // dragged off while held = released
  el.addEventListener("click", (e) => {
    if (e.detail !== 0) return;                                // 0 = keyboard activation, not a pointer click already handled above
    spinPick();
  });
}

wirePress(document.getElementById("pickBtn"));
wirePress(document.getElementById("pickAgain"));

/* ---- boot ----------------------------------------------------------------- */
async function boot(){
  const ti = todayIndex();
  selected = ti === null ? 0 : ti;
  buildRail(); render();

  try {
    const res = await fetch("lt.json", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (Array.isArray(data.restaurants) && data.restaurants.length){
      WEEK = data;
      buildRail(); render();
      setStatus(true, "Live");
      setChecked(WEEK.generated);
      return;
    }
    throw new Error("tomt svar");
  } catch (e) {
    setStatus(false, "Sparad meny");
  }
}
boot();
</script>
