<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FCFBF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F11" media="(prefers-color-scheme: dark)">
<title>Dagens lunch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FCFBF9; --surface:#FFFFFF; --surface-2:#F4F2EC;
    --ink:#1C1B19; --ink-soft:#3B3A35; --muted:#6C6A63; --faint:#9A978D;
    --hair:#E9E6DF; --hair-strong:#DAD6CC;
    --veg:#3F7A4B; --veg-soft:#E7F0E7;
    --treat:#9A6A16; --treat-soft:#F3E7CF;
    --sel:#1C1B19; --on-sel:#FCFBF9;
    --radius:18px; --radius-sm:10px;
    --shadow-rail:0 1px 0 var(--hair), 0 8px 24px -16px rgba(28,27,25,.28);
    --serif:"Fraunces", Georgia, "Times New Roman", serif;
    --sans:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --step:clamp(20px, 4vw, 30px);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0F0F11; --surface:#171719; --surface-2:#1E1E21;
      --ink:#ECEBE7; --ink-soft:#CDCBC4; --muted:#9B9A93; --faint:#6E6D66;
      --hair:#2A2A2E; --hair-strong:#38383D;
      --veg:#8FBF97; --veg-soft:#1F2A20;
      --treat:#D8A24E; --treat-soft:#332819;
      --sel:#ECEBE7; --on-sel:#141416;
      --shadow-rail:0 1px 0 var(--hair), 0 10px 28px -18px rgba(0,0,0,.7);
    }
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--sans); line-height:1.55; -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    max-width:640px; margin-inline:auto;
    padding:26px 22px calc(60px + env(safe-area-inset-bottom));
  }
  a{color:inherit}

  /* ---- masthead -------------------------------------------------------- */
  .masthead{
    display:flex; align-items:baseline; gap:10px 16px; flex-wrap:wrap;
    padding-bottom:16px; border-bottom:1px solid var(--hair);
  }
  .masthead .wk{
    font-family:var(--serif); font-weight:500; font-size:15px;
    letter-spacing:.005em; color:var(--ink-soft);
  }
  .masthead .status{
    margin-left:auto; display:inline-flex; align-items:center; gap:7px;
    font-size:11.5px; font-weight:500; letter-spacing:.06em; text-transform:uppercase;
    color:var(--faint);
  }
  .status .dot{width:6px; height:6px; border-radius:50%; background:var(--faint); flex:none}
  .status.live{color:var(--veg)}
  .status.live .dot{background:var(--veg); box-shadow:0 0 0 3px color-mix(in srgb,var(--veg) 20%,transparent)}
  .status.stale .dot{background:var(--faint)}

  /* ---- day rail (sticky) --------------------------------------------------- */
  .railwrap{
    position:sticky; top:0; z-index:5;
    margin:14px -22px 0; padding:12px 22px 12px;
    background:color-mix(in srgb,var(--bg) 86%,transparent);
    backdrop-filter:blur(12px) saturate(1.4); -webkit-backdrop-filter:blur(12px) saturate(1.4);
  }
  .rail{
    display:grid; grid-template-columns:repeat(5,1fr); gap:2px;
    background:var(--surface-2); border:1px solid var(--hair);
    border-radius:13px; padding:3px;
  }
  .day{
    appearance:none; border:0; background:transparent; cursor:pointer;
    border-radius:10px; padding:9px 2px 8px; color:var(--muted);
    font-family:var(--sans);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    transition:background .18s ease, color .18s ease;
  }
  .day .dow{font-weight:600; font-size:13px; letter-spacing:.02em}
  .day .dnum{font-size:10.5px; font-weight:500; color:var(--faint); min-height:1em; font-variant-numeric:tabular-nums}
  .day:hover{color:var(--ink)}
  .day[aria-selected="true"]{background:var(--sel); color:var(--on-sel)}
  .day[aria-selected="true"] .dnum{color:color-mix(in srgb,var(--on-sel) 72%,transparent)}
  .day .today-dot{width:3px; height:3px; border-radius:50%; background:currentColor; opacity:0; transition:opacity .18s}
  .day.is-today .today-dot{opacity:.45}
  .day.is-today[aria-selected="true"] .today-dot{opacity:.9}
  .day:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

  /* ---- day heading ------------------------------------------------------- */
  .dayhead{margin:var(--step) 0 calc(var(--step) - 4px)}
  .heading{
    font-family:var(--serif); font-weight:400; letter-spacing:-.01em;
    font-size:clamp(2.1rem, 6vw + .6rem, 2.9rem); line-height:1.05;
    margin:0; text-transform:capitalize; color:var(--ink);
  }
  .subnote{
    display:flex; align-items:center; gap:9px; margin:11px 0 0;
    color:var(--muted); font-size:13px;
  }
  .subnote .tag{
    font-weight:600; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
    padding:3px 7px 2px; border-radius:5px;
    background:var(--surface-2); color:var(--muted); border:1px solid var(--hair);
  }
  .subnote.today .tag{
    background:color-mix(in srgb,var(--veg) 16%,transparent);
    color:var(--veg); border-color:color-mix(in srgb,var(--veg) 28%,transparent);
  }
  .subnote .date{font-variant-numeric:tabular-nums}

  /* ---- places --------------------------------------------------------- */
  .places{display:flex; flex-direction:column}
  .place{
    --tint:color-mix(in srgb, hsl(var(--hue) 62% 45%) 100%, transparent);
    padding:var(--step) 0;
    border-top:1px solid var(--hair);
    animation:rise .3s cubic-bezier(.2,.7,.3,1) both;
  }
  .place:first-child{border-top:0; padding-top:6px}
  .place:nth-child(2){animation-delay:.05s}
  .place:nth-child(3){animation-delay:.10s}
  .place:nth-child(4){animation-delay:.15s}
  .place:nth-child(5){animation-delay:.20s}

  .place-head{display:flex; align-items:center; gap:11px; margin-bottom:14px}
  .shield{
    flex:none; width:30px; height:30px; border-radius:9px;
    display:grid; place-items:center;
    font-family:var(--serif); font-weight:500; font-size:15px; line-height:1;
    background:color-mix(in srgb, hsl(var(--hue) 58% 46%) 15%, var(--surface));
    color:hsl(var(--hue) 55% 34%);
    box-shadow:inset 0 0 0 1px color-mix(in srgb, hsl(var(--hue) 55% 45%) 30%, transparent);
  }
  @media (prefers-color-scheme: dark){
    .shield{
      background:color-mix(in srgb, hsl(var(--hue) 55% 55%) 16%, var(--surface));
      color:hsl(var(--hue) 60% 72%);
      box-shadow:inset 0 0 0 1px color-mix(in srgb, hsl(var(--hue) 55% 60%) 26%, transparent);
    }
  }
  .place-head h2{
    font-family:var(--serif); font-weight:500; font-size:1.28rem; letter-spacing:-.005em;
    margin:0; line-height:1.15; flex:1; min-width:0;
  }
  .place-head h2 a{
    text-decoration:none; display:inline; background-image:linear-gradient(var(--hair-strong),var(--hair-strong));
    background-size:100% 1px; background-repeat:no-repeat; background-position:0 100%;
    transition:background-size .2s ease;
  }
  .place-head h2 a:hover{
    background-image:linear-gradient(hsl(var(--hue) 55% 45%),hsl(var(--hue) 55% 45%));
  }
  .place-head .go{flex:none; color:var(--faint); font-size:13px; transition:color .15s}
  .place:hover .place-head .go{color:hsl(var(--hue) 55% 45%)}

  .dishes{margin:0; padding:0; list-style:none; display:flex; flex-direction:column}
  .dishes li{
    padding:9px 0 9px 20px; position:relative;
    font-size:15.5px; line-height:1.5; color:var(--ink-soft);
    border-top:1px solid color-mix(in srgb,var(--hair) 60%,transparent);
  }
  .dishes li:first-child{border-top:0}
  .dishes li::before{
    content:""; position:absolute; left:3px; top:16px; width:5px; height:5px;
    border-radius:50%; background:hsl(var(--hue) 45% 55%);
  }
  .dishes li.veg{color:var(--ink)}
  .dishes li.veg::before{background:var(--veg)}
  .dishes li.treat{color:var(--ink)}
  .dishes li.treat::before{background:var(--treat); rotate:45deg; border-radius:1px}
  .veg-chip, .treat-chip{
    display:inline-block; margin-right:7px; padding:1px 6px 0; border-radius:5px;
    font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    vertical-align:2px;
  }
  .veg-chip{background:var(--veg-soft); color:var(--veg)}
  .treat-chip{background:var(--treat-soft); color:var(--treat)}
  .empty-today{
    margin:2px 0 0; color:var(--faint); font-size:14px; font-style:italic;
    font-family:var(--serif);
  }

  /* ---- also open (demoted) ------------------------------------------------ */
  .others{margin-top:var(--step); border-top:1px solid var(--hair); padding-top:20px}
  .others summary{
    cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px;
    font-size:11.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    color:var(--faint);
  }
  .others summary::-webkit-details-marker{display:none}
  .others summary::after{content:"+"; margin-left:auto; font-size:14px; transition:transform .18s}
  .others[open] summary::after{transform:rotate(45deg)}
  .others ul{list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; gap:12px}
  .others li{font-size:13.5px; line-height:1.5}
  .others .rname{font-family:var(--serif); font-weight:500; font-size:15px}
  .others .rname a{text-decoration:none}
  .others .note{color:var(--faint); margin-left:8px}
  .others .static-text{display:block; color:var(--muted); margin-top:3px}

  /* ---- footer --------------------------------------------------------- */
  footer{
    margin-top:calc(var(--step) + 8px); padding-top:18px; border-top:1px solid var(--hair);
    color:var(--faint); font-size:11.5px; text-align:center;
    display:flex; flex-direction:column; gap:5px;
  }
  footer a{color:var(--muted); text-decoration:none; border-bottom:1px solid var(--hair)}
  footer a:hover{color:var(--ink)}

  @keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){
    .place{animation:none}
    *{transition-duration:.01ms !important}
  }
</style>
</head>
<body>
  <header class="masthead">
    <span class="wk" id="weeklabel">Dagens lunch</span>
    <span class="status stale" id="status"><span class="dot"></span><span id="statusText">Laddar…</span></span>
  </header>

  <div class="railwrap">
    <div class="rail" id="rail" role="tablist" aria-label="Välj dag"></div>
  </div>

  <div class="dayhead">
    <h1 class="heading" id="dayHeading">—</h1>
    <p class="subnote" id="daySub"></p>
  </div>

  <div class="places" id="places"></div>

  <details class="others" id="others" hidden>
    <summary><span id="othersLabel">Även öppet</span></summary>
    <ul id="othersList"></ul>
  </details>

  <footer>
    <span id="genLine"></span>
    <span>Skrapas varje vardagsmorgon · <a href="https://github.com/qlik-pas/lunch" target="_blank" rel="noopener">källkod</a></span>
  </footer>

<script>
/* ===========================================================================
   Today-first lunch board for five Lund places.

   Data: ./lt.json, written every weekday morning by scraper.py (GitHub Action).
   Shape: { week, range, dates[5], generated, restaurants:[{name,url,menus:{Day:[dish]}}] }
   If the fetch fails, the page renders the embedded snapshot below so it never
   shows blank.
   =========================================================================== */

const DAYS  = ["Måndag","Tisdag","Onsdag","Torsdag","Fredag"];
const SHORT = ["Mån","Tis","Ons","Tor","Fre"];

/* per-restaurant accent hue (falls back to a hash for unknown names) */
const HUES = {
  "Restaurang Edison": 32, "Bricks Eatery": 350, "Smaka på Kina": 292,
  "Kantin": 155, "Eatery": 210,
};
const hueFor = name => HUES[name] ??
  ([...name].reduce((h,c)=>(h*31 + c.charCodeAt(0))>>>0, 7) % 360);

/* ---- Embedded snapshot (fallback only) --------------------------------- */
let WEEK = {
  "week": 36,

        "Torsdag": ["Mexikansk “Asado de Puerco” gryta på fläskkött, ancho chili, salsa verde & basmatiris, picklad morot","Vannameiräkor i krämig tomatsås med soltorkad tomat, babyspenat & picklad fänkål, linguine med chili och vitlök","Krämig jordärtskockssoppa, gräslök & persiljeolja, rostad blomkål och krispig lök","Bonus: pannkakor, lättvispad grädde och hemmagjord sylt"],
        "Fredag": ["Krispig kycklingburgare med chipotle och jalapeno majo, sötpotatispommes och lagrad ost,","krispig kålsallad med lime och mango","Friterad kummel med dillmajonnäs, picklade grönsaker & kokt potatis med smör och gräslök","Bakad aubergine med salladsost, pesto, matvete och krispig rotfrukt, pumpafrö"]

        "Onsdag": ["Dongpo sidfläsk (东坡肉)","Gongbao kyckling (宫保鸡丁)","Snabbstekt pak choi (清炒油菜)","Tofu med honungsås (蜜汁豆腐)"],

        "Fredag": ["Chili kyckling (辣子鸡)","Fläsk med surkål och glasnudlar (猪肉酸菜炖粉条)","Jordens tre goda wok (地三鲜)"]
      }

        "Tisdag": ["Äggakaka med rökt morot, lingon, bakat äpple & persilja","Pasta med rökt skinka, ostsås, broccoli & gröna blad","Kyckling med citronsås, vaxbönor, bakad morot & rostad potatis"],

      }
    },
    {
      "name": "Kantin",
      "url": "https://www.kantinlund.se/",
      "menus": {
        "Måndag": ["Kalv tri-tip – bakad tomat – potatis & vitlöksstomp – borettanalök – sky – rostad lök – ört","Vegetariskt: Rostad spetskål – gochujang smörsås – sojabönor – cashewnötter – frissé – potatis – rostade frön"],
        "Tisdag": ["Nattbakad fläsksida – dillpickles hot sauce – blomkål – kål & äppleslaw – frön – potatis","Vegetariskt: Rostad spetskål – gochujang smörsås – sojabönor – cashewnötter – frissé – potatis – rostade frön"],
        "Onsdag": ["Kycklingsteak – chilimayo – tomat & bönsalsa – paksoi – sky- potatis","Vegetariskt: Rostad spetskål – gochujang smörsås – sojabönor – cashewnötter – frissé – potatis – rostade frön"],
        "Torsdag": ["Råbiffstorsdag – Oxtartar – tryffelaioli – rostad broccoli – picklad lök – parmesan – frön – krasse","Vegetariskt: Rostad spetskål – gochujang smörsås – sojabönor – cashewnötter – frissé – potatis – rostade frön"],
        "Fredag": ["Nattbakad oxkind – dragonmajo – rostad morot – pickles – chilisky – potatis – ört","Vegetariskt: Rostad spetskål – gochujang smörsås – sojabönor – cashewnötter – frissé – potatis – rostade frön"]
      }
    }
  ]
};

/* ---- classification: full block vs demoted to "also open" ------------- */
const isBlank = v => !Array.isArray(v) || v.filter(x => String(x).trim()).length === 0;

function classify(r){
  const filled = DAYS.map(d => r.menus?.[d]).filter(v => !isBlank(v));
  if (filled.length === 0) return { cat:"other", why:"ingen meny publicerad" };
  const flat = filled.map(v => v.join(" | "));
  if (new Set(flat).size === 1 && filled.length >= 4)
    return { cat:"other", why:"samma meny varje dag", text: filled[0].join(" · ") };
  return { cat:"place" };
}

/* ---- render --------------------------------------------------------------- */
let selected = 0;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayIndex = () => { const g = new Date().getDay(); return (g >= 1 && g <= 5) ? g - 1 : null; };
const fmtDate = iso => { try { return new Date(iso + "T00:00:00").toLocaleDateString("sv-SE",{day:"numeric",month:"short"}); } catch { return ""; } };

function dishItem(raw){
  const s = String(raw).trim().replace(/\s{2,}/g, " ");
  let m = s.match(/^vegetarisk[t]?\s*:\s*(.+)/i);
  if (m) return `<li class="veg"><span class="veg-chip">Grönt</span>${esc(m[1])}</li>`;
  m = s.match(/^bonus\s*:\s*(.+)/i);
  if (m) return `<li class="treat"><span class="treat-chip">Bonus</span>${esc(m[1])}</li>`;
  return `<li>${esc(s)}</li>`;
}

function buildRail(){
  const rail = document.getElementById("rail");
  const ti = todayIndex();
  rail.innerHTML = "";
  DAYS.forEach((d,i) => {
    const b = document.createElement("button");
    b.className = "day" + (ti === i ? " is-today" : "");
    b.type = "button";
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", String(i === selected));
    b.setAttribute("aria-label", d + (WEEK.dates?.[i] ? " " + fmtDate(WEEK.dates[i]) : ""));
    b.innerHTML =
      `<span class="dow">${SHORT[i]}</span>` +
      `<span class="dnum">${WEEK.dates?.[i] ? fmtDate(WEEK.dates[i]) : ""}</span>` +
      `<span class="today-dot"></span>`;
    b.addEventListener("click", () => { selected = i; render(); });
    rail.appendChild(b);
  });
}

function render(){
  const day = DAYS[selected], ti = todayIndex();

  document.getElementById("weeklabel").textContent =
    WEEK.week ? `Vecka ${WEEK.week}${WEEK.range ? " · " + WEEK.range : ""}` : "Dagens lunch";
  document.querySelectorAll(".day").forEach((b,i) => b.setAttribute("aria-selected", String(i === selected)));

  document.getElementById("dayHeading").textContent = day;
  const sub = document.getElementById("daySub");
  const dateStr = WEEK.dates?.[selected] ? fmtDate(WEEK.dates[selected]) : "";
  if (ti === null && selected === 0){
    sub.className = "subnote"; sub.innerHTML = `<span class="tag">Helg</span><span class="date">visar måndag</span>`;
  } else if (ti === selected){
    sub.className = "subnote today"; sub.innerHTML = `<span class="tag">Idag</span><span class="date">${dateStr}</span>`;
  } else {
    sub.className = "subnote"; sub.innerHTML = `<span class="date">${dateStr}</span>`;
  }

  const wrap = document.getElementById("places");
  const others = [];
  wrap.innerHTML = "";

  WEEK.restaurants.forEach(r => {
    const info = classify(r);
    if (info.cat !== "place"){ others.push({ r, info }); return; }

    const dishes = Array.isArray(r.menus[day]) ? r.menus[day].filter(x => String(x).trim()) : [];
    const body = dishes.length
      ? `<ul class="dishes">${dishes.map(dishItem).join("")}</ul>`
      : `<p class="empty-today">Ingen dagsmeny idag</p>`;
    const initial = esc([...r.name][0] || "•");

    const el = document.createElement("article");
    el.className = "place";
    el.style.setProperty("--hue", hueFor(r.name));
    el.innerHTML =
      `<div class="place-head">` +
        `<span class="shield" aria-hidden="true">${initial}</span>` +
        `<h2><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a></h2>` +
        `<span class="go" aria-hidden="true">↗</span>` +
      `</div>${body}`;
    wrap.appendChild(el);
  });

  const list = document.getElementById("othersList");
  list.innerHTML = others.map(({r,info}) =>
    `<li><span class="rname"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a></span>` +
    `<span class="note">${esc(info.why)}</span>` +
    (info.text ? `<span class="static-text">${esc(info.text)}</span>` : ``) + `</li>`
  ).join("");
  document.getElementById("others").hidden = others.length === 0;
  document.getElementById("othersLabel").textContent = `Även öppet (${others.length})`;
}

function setStatus(live, note){
  const s = document.getElementById("status");
  s.className = "status " + (live ? "live" : "stale");
  document.getElementById("statusText").textContent = note;
}

function setChecked(menuIso){
  /* The live fetch just succeeded, so "now" is when the menu was last checked.
     `generated` is when the menu content last changed — usually Monday, and
     that's fine for a weekly menu, so only spell it out when it's not today. */
  const now = new Date();
  let line = `Kontrollerad kl ${now.toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"})}`;
  try {
    const menu = new Date(menuIso);
    if (!isNaN(menu) && menu.toDateString() !== now.toDateString())
      line += ` · menyn från ${menu.toLocaleDateString("sv-SE",{weekday:"short",day:"numeric",month:"short"})}`;
  } catch {}
  document.getElementById("genLine").textContent = line;
}

/* ---- boot ----------------------------------------------------------------- */
async function boot(){
  const ti = todayIndex();
  selected = ti === null ? 0 : ti;
  buildRail(); render();

  try {
    const res = await fetch("lt.json", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (Array.isArray(data.restaurants) && data.restaurants.length){
      WEEK = data;
      buildRail(); render();
      setStatus(true, "Live");
      setChecked(WEEK.generated);
      return;
    }
    throw new Error("tomt svar");
  } catch (e) {
    setStatus(false, "Sparad meny");
  }
}
boot();
</script>
