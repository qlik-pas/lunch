# Temporary: dumps the text scraper.py sees for Inspira, to debug the parser.
name: Dump Inspira
on:
  push:
    branches: [dump-inspira]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - run: |
          mkdir -p dump
          python - <<'PY'
          import scraper as S
          t = S.fetch_html_text("https://restauranginspira.se/")
          open("dump/inspira.txt","w").write(t)
          open("dump/inspira-lines.txt","w").write("\n".join(repr(l) for l in S._lines(t)))
          PY
      - run: |
          git config user.name lunch-bot; git config user.email lunch-bot@users.noreply.github.com
          git add dump && git commit -m "dump inspira" && git push
